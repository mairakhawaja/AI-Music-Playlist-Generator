mutation CreateUser @auth(level: USER) {
  user_insert(data: { id_expr: "auth.uid", username: "newuser", email: "user@example.com" })
}

mutation UpdateUser @auth(level: USER) {
  user_update(key: { id_expr: "auth.uid" }, data: { username: "updatedname" })
}

mutation DeleteUser @auth(level: USER) {
  user_delete(key: { id_expr: "auth.uid" })
}

query GetUser @auth(level: USER) {
  user(key: { id_expr: "auth.uid" }) {
    username
    email
  }
}

query ListUsers @auth(level: PUBLIC, insecureReason: "Public list of usernames is required for search functionality.") {
  users {
    username
  }
}

mutation CreatePlaylist @auth(level: USER) {
  playlist_insert(data: {
    name: "My Jams",
    promptUsed: "Upbeat pop songs",
    createdAt_expr: "request.time",
    user: { id_expr: "auth.uid" }
  })
}

mutation UpdatePlaylist @auth(level: USER) {
  playlist_update(key: { id: "00000000-0000-0000-0000-000000000000" }, data: { name: "New Playlist Name" })
}

mutation DeletePlaylist @auth(level: USER) {
  playlist_delete(key: { id: "00000000-0000-0000-0000-000000000000" })
}

query GetPlaylist @auth(level: USER) {
  playlist(id: "00000000-0000-0000-0000-000000000000") {
    name
    description
  }
}

query ListMyPlaylists @auth(level: USER) {
  playlists(where: { userId: { eq_expr: "auth.uid" } }) {
    name
  }
}

mutation CreatePlaylistTrack @auth(level: USER) {
  playlistTrack_insert(data: {
    playlist: { id: "00000000-0000-0000-0000-000000000000" },
    track: { id: "00000000-0000-0000-0000-000000000000" },
    rating: "5"
  })
}

mutation UpdatePlaylistTrack @auth(level: USER) {
  playlistTrack_update(key: { id: "00000000-0000-0000-0000-000000000000" }, data: { rating: "4" })
}

mutation DeletePlaylistTrack @auth(level: USER) {
  playlistTrack_delete(key: { id: "00000000-0000-0000-0000-000000000000" })
}

query GetPlaylistTrack @auth(level: USER) {
  playlistTrack(id: "00000000-0000-0000-0000-000000000000") {
    rating
  }
}

query ListPlaylistTracks @auth(level: USER) {
  playlistTracks(where: { playlistId: { eq: "00000000-0000-0000-0000-000000000000" } }) {
    track { title artist }
  }
}

mutation CreateTrack @auth(level: USER) {
  track_insert(data: { title: "Song Name", artist: "Artist", genre: "Rock" })
}

mutation UpdateTrack @auth(level: USER) {
  track_update(key: { id: "00000000-0000-0000-0000-000000000000" }, data: { albumTitle: "New Album" })
}

mutation DeleteTrack @auth(level: USER) {
  track_delete(key: { id: "00000000-0000-0000-0000-000000000000" })
}

query GetTrack @auth(level: PUBLIC, insecureReason: "Public tracks index is necessary for playlist generation.") {
  track(id: "00000000-0000-0000-0000-000000000000") {
    title
    artist
  }
}

query ListTracks @auth(level: PUBLIC, insecureReason: "Public list of tracks is necessary for browsing.") {
  tracks {
    title
    artist
  }
}

mutation CreateLog @auth(level: USER) {
  generationLog_insert(data: {
    prompt: "Generate a morning playlist",
    timestamp_expr: "request.time",
    user: { id_expr: "auth.uid" }
  })
}

mutation DeleteLog @auth(level: USER) {
  generationLog_delete(key: { id: "00000000-0000-0000-0000-000000000000" })
}

query ListMyLogs @auth(level: USER) {
  generationLogs(where: { userId: { eq_expr: "auth.uid" } }) {
    prompt
    timestamp
  }
}