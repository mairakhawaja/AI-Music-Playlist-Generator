name: CI/CD — Build, Test & Deploy

on:
  push:
    branches: [main]

jobs:
  test:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test backend
        run: npx vitest run
        working-directory: packages/backend

      - name: Test frontend
        run: npx vitest run
        working-directory: packages/frontend

  build-and-deploy:
    name: Build & Deploy
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build frontend
        run: npm run build
        working-directory: packages/frontend
        env:
          VITE_API_BASE_URL: ${{ vars.BACKEND_URL }}/api

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            -f packages/backend/Dockerfile \
            -t ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/ai-music-generator/backend:${{ github.sha }} \
            -t ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/ai-music-generator/backend:latest \
            .

      - name: Push Docker image
        run: |
          docker push ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/ai-music-generator/backend:${{ github.sha }}
          docker push ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/ai-music-generator/backend:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ai-music-generator-backend \
            --image ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/ai-music-generator/backend:${{ github.sha }} \
            --region ${{ vars.GCP_REGION }} \
            --platform managed \
            --port 8080 \
            --concurrency 80 \
            --min-instances 0 \
            --max-instances 3 \
            --memory 256Mi \
            --cpu 1 \
            --set-env-vars "NODE_ENV=production,SPOTIFY_CLIENT_ID=${{ vars.SPOTIFY_CLIENT_ID }},FRONTEND_URL=https://${{ vars.GCP_PROJECT_ID }}.web.app,SPOTIFY_REDIRECT_URI=https://${{ vars.GCP_PROJECT_ID }}.web.app/callback" \
            --allow-unauthenticated \
            --quiet

      - name: Deploy to Firebase Hosting
        run: npx firebase deploy --only hosting --token ${{ secrets.FIREBASE_TOKEN }}
